<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://t2.gstatic.com https://www.google.com https://icons.duckduckgo.com https://api.qrserver.com; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>VaultGuard</title>

  <!-- Brand mark: shielded keyhole, blue gradient -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232563eb'/><stop offset='1' stop-color='%231e40af'/></linearGradient></defs><path d='M16 2 L28 6 V15 C28 22.5 22.5 28 16 30 C9.5 28 4 22.5 4 15 V6 Z' fill='url(%23g)'/><circle cx='16' cy='15' r='3.2' fill='white'/><rect x='14.5' y='15' width='3' height='6' rx='1.2' fill='white'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="premium.css">
</head>
<body>
  <div id="app">

    <div class="titlebar">
      <div class="titlebar-drag-region">
        <div class="titlebar-logo">
          <svg width="20" height="20" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="vg-brand" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#2563eb"/>
                <stop offset="100%" stop-color="#1e40af"/>
              </linearGradient>
            </defs>
            <path d="M16 2 L28 6 V15 C28 22.5 22.5 28 16 30 C9.5 28 4 22.5 4 15 V6 Z" fill="url(#vg-brand)"/>
            <circle cx="16" cy="15" r="3.2" fill="white"/>
            <rect x="14.5" y="15" width="3" height="6" rx="1.2" fill="white"/>
          </svg>
          Vault<span style="color:var(--accent)">Guard</span>
        </div>
      </div>
      <div class="titlebar-controls">
        <button class="titlebar-btn" id="btn-minimize" title="Minimize" aria-label="Minimize">
          <svg width="10" height="2" viewBox="0 0 10 2"><rect width="10" height="2" rx="1" fill="currentColor"/></svg>
        </button>
        <button class="titlebar-btn" id="btn-maximize" title="Maximize" aria-label="Maximize">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        </button>
        <button class="titlebar-btn close" id="btn-close" title="Close" aria-label="Close">
          <svg width="10" height="10" viewBox="0 0 10 10">
            <line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="main-content"></div>
  </div>

  <div id="toast-container"></div>
  <div id="modal-overlay" class="hidden"></div>
  <div id="modal-container" class="hidden"></div>

  <script src="mock-api.js"></script>
  <script src="app.js"></script>
  <script src="premium.js"></script>
</body>
</html>
